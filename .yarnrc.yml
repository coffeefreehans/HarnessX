enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules
# The DSH runtime family is pinned by upstream.json and reviewed as one unit,
# so the scope bypasses Yarn's minimum-publish-age quarantine. Third-party
# packages keep the default 1-day gate.
npmPreapprovedPackages:
  - "@deepseek-ai/*"
supportedArchitectures:
  cpu:
    - x64
    - arm64
